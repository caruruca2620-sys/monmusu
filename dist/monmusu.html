<title>달빛 숲의 몬무스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* 달빛 숲의 몬무스 — 한 가지 세계(밤의 숲)에 맞춘 단일 다크 테마
   Layout: 가운데 정렬된 게임 화면(최대 960px), 모바일에선 한 열로 쌓인다. */
:root {
  color-scheme: dark;
  --night: #121821;      /* 바탕: 이끼빛이 도는 밤 */
  --bough: #1b2430;      /* 패널 */
  --bough-2: #243142;    /* 올라온 패널/버튼 */
  --line: #34465a;       /* 테두리 */
  --moon: #efe6d2;       /* 본문 글자: 달빛 종이 */
  --moon-dim: #a9b1b8;   /* 보조 글자 */
  --lantern: #ffb547;    /* 강조: 등불 */
  --lantern-deep: #c97a12;
  --heart: #ff6f9c;      /* 호감도 */
  --leafhp: #5fd38d;     /* HP */
  --danger: #ff6b5a;
  --sleep: #8ea2ff;
  --shadow: rgba(0, 0, 0, 0.45);

  --font-display: 'Jua', 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-body: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  --font-num: 'Jua', ui-rounded, 'Apple SD Gothic Neo', sans-serif;

  --r: 14px;
  --gap: 12px;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  background-image:
    radial-gradient(1200px 500px at 80% -10%, rgba(255, 243, 176, 0.08), transparent 60%),
    radial-gradient(900px 600px at -10% 110%, rgba(95, 211, 141, 0.06), transparent 60%);
  background-attachment: fixed;
  color: var(--moon);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; text-wrap: balance; margin: 0; }

#app {
  max-width: 960px;
  margin: 0 auto;
  min-height: 100%;
  padding-block: 12px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: var(--gap);
}

/* ── 공용 ─────────────────────────────── */
.btn {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--bough-2);
  border-radius: 12px;
  padding: 10px 16px;
  cursor: pointer;
  transition: transform 0.08s, background 0.15s, border-color 0.15s;
  text-align: center;
}
.btn:hover:not(:disabled) { border-color: var(--lantern); }
.btn:active:not(:disabled) { transform: translateY(1px) scale(0.99); }
.btn:focus-visible, .node:focus-visible, .unit:focus-visible, .choice:focus-visible { outline: 2px solid var(--lantern); outline-offset: 2px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--lantern); color: #2a1a05; border-color: var(--lantern); font-family: var(--font-display); font-size: 17px; }
.btn.primary:hover:not(:disabled) { background: #ffc66e; }
.btn.ghost { background: transparent; }
.btn.small { padding: 6px 10px; font-size: 13px; border-radius: 10px; }
.btn.heart { border-color: var(--heart); color: var(--heart); }
.row { display: flex; gap: var(--gap); flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.row.center { justify-content: center; }
.stack { display: flex; flex-direction: column; gap: var(--gap); }
.panel { background: var(--bough); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.muted { color: var(--moon-dim); }
.small { font-size: 13px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; padding: 1px 8px; border-radius: 999px;
  background: var(--bough-2); border: 1px solid var(--line); white-space: nowrap;
}
.eyebrow { font-size: 12px; letter-spacing: 0.12em; color: var(--lantern); }

/* ── 상단 바 ─────────────────────────── */
.topbar {
  display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
  background: var(--bough); border: 1px solid var(--line); border-radius: var(--r);
  padding: 8px 12px;
}
.topbar .title { font-family: var(--font-display); font-size: 17px; color: var(--lantern); }
.topbar .spacer { flex: 1; }
.relics { display: flex; gap: 4px; flex-wrap: wrap; }
.relic { font-size: 18px; cursor: help; position: relative; }

/* ── 타이틀 ──────────────────────────── */
.title-screen { align-items: center; text-align: center; padding-top: 4vh; }
.title-art { position: relative; width: min(520px, 100%); aspect-ratio: 13 / 6; max-width: 100%; }
.title-art .moon {
  position: absolute; right: 8%; top: 0; width: 22%; aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 40%, #fffbe6, #f3e2a6 60%, #d9c27a);
  box-shadow: 0 0 60px rgba(255, 240, 180, 0.35);
}
.title-art .cast { position: absolute; inset: auto 0 0 0; display: flex; justify-content: center; align-items: flex-end; }
.title-art .cast svg { width: 24%; margin: 0 -3%; filter: drop-shadow(0 6px 10px var(--shadow)); }
.title-art .cast svg:nth-child(2) { width: 30%; z-index: 1; }
.logo { font-family: var(--font-display); font-size: clamp(34px, 8vw, 58px); line-height: 1.1; color: var(--moon); text-shadow: 0 3px 0 var(--lantern-deep), 0 0 30px rgba(255, 181, 71, 0.35); }
.logo small { display: block; font-size: 0.36em; color: var(--lantern); text-shadow: none; letter-spacing: 0.3em; margin-top: 6px; }
.title-menu { display: grid; gap: 10px; width: min(320px, 100%); }
.title-stats { font-size: 13px; color: var(--moon-dim); }

/* ── 동료 선택 ───────────────────────── */
.starters { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--gap); }
.starter { cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 8px; }
.starter:hover { border-color: var(--lantern); }
.starter .pic { width: 120px; margin: 0 auto; }
.skill-list { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.skill-list b { font-weight: 400; color: var(--lantern); font-family: var(--font-display); }

/* ── 지도 ────────────────────────────── */
.map-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: var(--gap); align-items: start; }
@media (max-width: 760px) { .map-wrap { grid-template-columns: minmax(0, 1fr); } }
.map { position: relative; padding: 16px 8px; overflow: hidden; }
.map h2 { font-size: 22px; }
.map-board { position: relative; margin: 10px auto 0; width: 100%; max-width: 440px; }
.map-board svg.edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.node {
  position: absolute; transform: translate(-50%, -50%);
  width: 46px; height: 46px; border-radius: 50%;
  border: 2px solid var(--line); background: var(--bough-2);
  display: grid; place-items: center; font-size: 21px; cursor: default; padding: 0;
}
.node.boss { width: 66px; height: 66px; font-size: 30px; border-color: var(--danger); }
.node.visited { opacity: 0.45; filter: grayscale(0.6); }
.node.current { border-color: var(--moon); box-shadow: 0 0 0 4px rgba(239, 230, 210, 0.2); opacity: 1; filter: none; }
.node.open { cursor: pointer; border-color: var(--lantern); animation: pulse 1.6s infinite; }
.node.open:hover { background: var(--lantern-deep); }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 181, 71, 0.5); } 50% { box-shadow: 0 0 0 8px rgba(255, 181, 71, 0); } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--moon-dim); justify-content: center; margin-top: 8px; }

.party-side { display: flex; flex-direction: column; gap: 8px; }
.mini {
  display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; align-items: center;
  padding: 8px; border-radius: 12px; background: var(--bough); border: 1px solid var(--line); cursor: pointer; text-align: left;
}
.mini:hover { border-color: var(--lantern); }
.mini .pic { width: 52px; height: 52px; border-radius: 10px; overflow: hidden; }
.mini.fainted .pic { filter: grayscale(1) brightness(0.7); }

/* ── 수다 / 인연 ─────────────────────── */
.synergy-box { padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.synergy-box b { font-family: var(--font-display); font-weight: 400; color: var(--heart); }
.chat { display: flex; flex-direction: column; gap: 6px; }
.chat-line { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 8px; align-items: end; }
.chat-pic { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; background: var(--bough-2); display: block; }
.chat-pic svg { width: 100%; height: 100%; display: block; }
.chat-bubble { background: var(--moon); color: #2a2233; border-radius: 12px 12px 12px 3px; padding: 6px 10px; font-size: 13px; line-height: 1.4; }
.chat-bubble b { font-family: var(--font-display); font-weight: 400; color: var(--lantern-deep); margin-right: 2px; }
.tag.on { border-color: var(--heart); color: var(--heart); }
.recruit-pic.big { width: 190px; }
.boss-intro { border-color: var(--danger); }
.tut { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }

/* ── 바 ──────────────────────────────── */
.bar { position: relative; height: 9px; border-radius: 6px; background: rgba(0, 0, 0, 0.35); overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; border-radius: 6px; transition: width 0.35s ease; }
.bar.hp > i { background: linear-gradient(90deg, #3fb873, var(--leafhp)); }
.bar.hp.low > i { background: linear-gradient(90deg, #d9483b, var(--danger)); }
.bar.bond > i { background: linear-gradient(90deg, #e2507f, var(--heart)); }
.bar.xp { height: 5px; }
.bar.xp > i { background: var(--sleep); }
.bar .shield { position: absolute; right: 0; top: 0; bottom: 0; background: repeating-linear-gradient(45deg, rgba(160, 200, 255, 0.8) 0 3px, rgba(160, 200, 255, 0.4) 3px 6px); border-radius: 6px; }
.barline { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.barline .bar { flex: 1; }
.barline .lbl { width: 14px; text-align: center; }
.barline .val { min-width: 54px; text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* ── 전투 ────────────────────────────── */
.battle { display: flex; flex-direction: column; gap: 10px; }
.side { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 210px)); justify-content: center; gap: 10px; }
.unit {
  position: relative; background: var(--bough); border: 1.5px solid var(--line); border-radius: var(--r);
  padding: 8px; display: flex; flex-direction: column; gap: 5px; text-align: left; transition: transform 0.15s, opacity 0.4s, border-color 0.15s;
}
.unit .pic { position: relative; width: 100%; max-width: 132px; aspect-ratio: 1; margin: 0 auto; border-radius: 12px; }
.unit .pic svg { width: 100%; height: 100%; display: block; }
.unit .name { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.unit .name b { font-family: var(--font-display); font-weight: 400; font-size: 16px; }
.unit .sts { display: flex; flex-wrap: wrap; gap: 3px; min-height: 20px; }
.unit .st { font-size: 11px; padding: 0 5px; border-radius: 8px; background: rgba(0, 0, 0, 0.3); white-space: nowrap; }
.unit .st.bad { color: #ffb3a8; }
.unit.ally.ready { border-color: var(--lantern); }
.unit.ally.selected { box-shadow: 0 0 0 3px var(--lantern); }
.unit.acted { opacity: 0.62; }
.unit.targetable { cursor: pointer; border-color: var(--heart); animation: pulse-t 1.2s infinite; }
.unit.targetable.foe-t { border-color: var(--danger); animation-name: pulse-d; }
@keyframes pulse-t { 50% { box-shadow: 0 0 0 5px rgba(255, 111, 156, 0.25); } }
@keyframes pulse-d { 50% { box-shadow: 0 0 0 5px rgba(255, 107, 90, 0.28); } }
.unit.gone { opacity: 0.25; filter: grayscale(0.7); }
.unit.gone.friend { opacity: 0.85; filter: none; border-color: var(--heart); }
.unit.fainted .pic { filter: grayscale(1) brightness(0.6); }
.unit.shake { animation: shake 0.35s; }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
.unit.lunge.enemy { animation: lungeDown 0.3s; }
.unit.lunge.ally { animation: lungeUp 0.3s; }
@keyframes lungeDown { 50% { transform: translateY(10px) scale(1.03); } }
@keyframes lungeUp { 50% { transform: translateY(-10px) scale(1.03); } }
.unit .badge { position: absolute; top: 6px; left: 6px; font-size: 12px; z-index: 2; }
.intent {
  position: absolute; top: -10px; right: 8px; z-index: 3;
  background: var(--night); border: 1px solid var(--line); border-radius: 10px; padding: 1px 8px; font-size: 12px;
  max-width: calc(100% - 16px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.intent.atk { border-color: var(--danger); }
.intent.shy { border-color: var(--heart); color: var(--heart); }
.float {
  position: absolute; left: 50%; top: 35%; transform: translate(-50%, 0); pointer-events: none; z-index: 5;
  font-family: var(--font-num); font-size: 24px; text-shadow: 0 2px 0 #000, 0 0 6px #000;
  animation: floatUp 1s ease-out forwards; white-space: nowrap;
}
.float.dmg { color: #fff; }
.float.crit { color: var(--lantern); font-size: 30px; }
.float.heal { color: var(--leafhp); }
.float.bond { color: var(--heart); }
.float.miss { color: var(--moon-dim); font-size: 18px; }
.float.block { color: #a0c8ff; font-size: 18px; }
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 10px) scale(0.8); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -46px) scale(1); } }
.speech {
  position: absolute; left: 6px; right: 6px; top: 40%; z-index: 6; pointer-events: none;
  background: var(--moon); color: #2a2233; border-radius: 12px; padding: 6px 9px; font-size: 13px; line-height: 1.4;
  box-shadow: 0 6px 18px var(--shadow); animation: pop 2.6s forwards;
}
@keyframes pop { 0% { opacity: 0; transform: scale(0.9); } 8% { opacity: 1; transform: scale(1); } 85% { opacity: 1; } 100% { opacity: 0; } }

.vs { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--moon-dim); }
.vs::before, .vs::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.log {
  background: rgba(0, 0, 0, 0.25); border-radius: 10px; padding: 6px 10px; font-size: 13px; min-height: 2.6em;
  max-height: 5.4em; overflow-y: auto; color: var(--moon-dim);
}
.log p { margin: 0; }
.log p:last-child { color: var(--moon); }

.command { display: flex; flex-direction: column; gap: 10px; }
.command .who { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 16px; }
.skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.skill { text-align: left; display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; }
.skill .top { display: flex; justify-content: space-between; gap: 6px; font-family: var(--font-display); font-size: 15px; }
.skill .desc { font-size: 12px; color: var(--moon-dim); line-height: 1.35; }
.skill.k-charm { border-color: rgba(255, 111, 156, 0.6); }
.skill.k-heal { border-color: rgba(95, 211, 141, 0.6); }
.skill.k-attack { border-color: rgba(255, 107, 90, 0.5); }
.skill.selected { background: var(--lantern-deep); border-color: var(--lantern); }
.keeper { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.keeper .lbl { font-size: 12px; color: var(--moon-dim); }
.bag { display: flex; flex-wrap: wrap; gap: 6px; }
.item-btn { display: inline-flex; align-items: center; gap: 4px; }
.item-btn .n { font-family: var(--font-num); font-size: 12px; color: var(--moon-dim); }
.hint { font-size: 13px; color: var(--lantern); min-height: 1.4em; }

/* ── 이벤트/보상 ─────────────────────── */
.scene { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 600px) { .scene { grid-template-columns: minmax(0, 1fr); } .scene .art { justify-self: center; } }
.scene .art { font-size: 92px; line-height: 1; text-align: center; width: 160px; height: 160px; display: grid; place-items: center; background: radial-gradient(circle, rgba(255, 181, 71, 0.18), transparent 70%); border-radius: 50%; }
.scene .art svg { width: 150px; }
.scene h2 { font-size: 26px; margin-bottom: 8px; }
.scene p { margin: 0 0 10px; max-width: 60ch; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { text-align: left; }
.result { border-left: 3px solid var(--lantern); padding: 4px 0 4px 12px; }

.reward-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.relic-card { text-align: left; display: flex; flex-direction: column; gap: 4px; }
.relic-card .ic { font-size: 30px; }
.relic-card b { font-family: var(--font-display); font-weight: 400; font-size: 16px; }

.shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.good { display: flex; flex-direction: column; gap: 6px; text-align: left; }
.good .head { display: flex; gap: 8px; align-items: center; font-family: var(--font-display); font-size: 16px; }
.good .ic { font-size: 26px; }
.good .price { color: var(--lantern); font-family: var(--font-num); }
.good.sold { opacity: 0.4; }

/* ── 도감 ────────────────────────────── */
.codex { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.codex .entry { display: flex; flex-direction: column; gap: 4px; text-align: center; }
.codex .entry .pic { width: 110px; margin: 0 auto; }
.codex .entry.unknown .pic { filter: brightness(0) opacity(0.35); }
.codex .entry.seen .pic { filter: grayscale(1) opacity(0.7); }
.codex .entry b { font-family: var(--font-display); font-weight: 400; }

/* ── 모달 ────────────────────────────── */
.modal-back {
  position: fixed; inset: 0; z-index: 50; background: rgba(5, 8, 12, 0.72);
  display: grid; place-items: center;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  animation: fade 0.2s;
}
@keyframes fade { from { opacity: 0; } }
.modal { width: min(560px, 100%); max-height: 100%; overflow-y: auto; background: var(--bough); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 60px var(--shadow); }
.modal h2 { font-size: 22px; }
.detail-head { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 14px; align-items: center; }
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; text-align: center; font-size: 12px; }
.stats div { background: var(--bough-2); border-radius: 8px; padding: 4px 2px; }
.stats b { display: block; font-family: var(--font-num); font-weight: 400; font-size: 16px; color: var(--moon); }
.recruit-pic { width: 150px; margin: 0 auto; animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px); } }
.quote { background: var(--moon); color: #2a2233; border-radius: 14px; padding: 10px 14px; position: relative; }

.ending { text-align: center; align-items: center; }
.ending p { max-width: 56ch; margin: 0 auto; }
.ending .cast { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px; }
.ending .cast svg { width: 90px; }

.toast {
  position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60;
  background: var(--moon); color: #2a2233; padding: 8px 16px; border-radius: 999px; font-size: 14px; box-shadow: 0 8px 24px var(--shadow);
  animation: pop 2.4s forwards; max-width: calc(100% - 32px);
}

.help p, .help li { max-width: 65ch; }
.help h3 { color: var(--lantern); font-size: 18px; margin-top: 6px; }

@media (max-width: 520px) {
  body { font-size: 14px; }
  .side { grid-template-columns: repeat(auto-fit, minmax(140px, 176px)); gap: 8px; }
  .unit { padding: 6px; }
  .unit .pic { max-width: 92px; }
  .unit .name b { font-size: 14px; }
  .skills { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .skill .desc { display: none; }
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

</style>

// 시드 기반 난수 (mulberry32). 같은 시드면 같은 모험이 펼쳐진다.
function createRng(seed) {
  let s = (typeof seed === 'number' ? seed : hashString(String(seed))) >>> 0;
  const next = () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const rng = {
    next,
    float: (min, max) => min + next() * (max - min),
    int: (min, max) => Math.floor(min + next() * (max - min + 1)),
    chance: (p) => next() < p,
    pick: (arr) => arr[Math.floor(next() * arr.length)],
    weighted(entries) {
      // entries: [[value, weight], ...]
      const total = entries.reduce((a, [, w]) => a + w, 0);
      let r = next() * total;
      for (const [v, w] of entries) {
        if ((r -= w) < 0) return v;
      }
      return entries[entries.length - 1][0];
    },
    shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(next() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    },
    getState: () => s,
    setState: (v) => { s = v >>> 0; },
  };
  return rng;
}

  for (let i = 0; i < str.length; i++) {

  }

// 막(Act)마다 갈림길이 있는 지도를 만든다.
const MAP_ROWS = 7; // 보스 전 층 수
const MAP_COLS = 4;

const NODE_TYPES = {
  battle: { name: '야생 몬무스', icon: '🐾' },
  elite: { name: '강한 기척', icon: '💢' },
  event: { name: '수상한 곳', icon: '❓' },
  shop: { name: '떠돌이 상점', icon: '🛍️' },
  rest: { name: '모닥불', icon: '🔥' },
  treasure: { name: '보물', icon: '🎁' },
  boss: { name: '숲의 주인', icon: '👑' },
};

function generateMap(rng, act) {
  const nodes = new Map(); // key "r,c"
  const key = (r, c) => `${r},${c}`;
  const get = (r, c) => {
    const k = key(r, c);
    if (!nodes.has(k)) nodes.set(k, { id: k, row: r, col: c, type: null, next: [] });
    return nodes.get(k);
  };

  // 경로 4개: 시작점 3개 + 하나는 겹치게
  const paths = [...starts, rng.pick(starts)];
  const edges = new Set();
  for (let c of paths) {
    let node = get(0, c);
    for (let r = 1; r < MAP_ROWS; r++) {
      let nc = Math.min(MAP_COLS - 1, Math.max(0, c + rng.int(-1, 1)));
      // 교차 방지: (r-1,c)→(r,nc)와 반대 방향 간선이 있으면 직진
      if (nc !== c && edges.has(`${r - 1},${nc}>${r},${c}`)) nc = c;
      const nxt = get(r, nc);
      const ek = `${r - 1},${c}>${r},${nc}`;
      if (!edges.has(ek)) { edges.add(ek); node.next.push(nxt.id); }
      node = nxt;
      c = nc;
    }
  }

  for (const n of nodes.values()) if (n.row === MAP_ROWS - 1) n.next.push('boss');

  for (const n of nodes.values()) {
    if (n.type) continue;

    else if (n.row === 3) n.type = 'treasure';
    else {

      if (n.row >= 2) w.push(['elite', act === 1 ? 10 : 14], ['shop', 11]);
      if (n.row >= 2 && n.row !== MAP_ROWS - 2) w.push(['rest', 7]);
      n.type = rng.weighted(w);

  // 같은 줄에 상점/휴식이 너무 몰리지 않게 정리
  for (let r = 1; r < MAP_ROWS - 1; r++) {
    const row = [...nodes.values()].filter((n) => n.row === r);
    for (const t of ['shop', 'rest', 'elite']) {

function portraitSVG(speciesId, expr = 'normal', opts = {}) {
  const sp = SPECIES[speciesId];
  const lk = sp.look;
  const f = new Set(lk.features);
  const hairC = lk.hair;
  const hairD = shade(lk.hair, -0.35);
  const skin = lk.skin;
  const skinD = shade(skin, -0.2);
  const skinAlpha = lk.skinAlpha ?? 1;
  const outfit = lk.outfit;
  const headLift = f.has('floatingHead') ? -7 : 0;

  let back = '';
  for (const k of ['moon', 'chest', 'wings', 'dragonWings', 'foxTails', 'catTail', 'spiderLegs', 'vines']) {
    if (f.has(k) && BEHIND[k]) back += BEHIND[k](lk);
  }

  // 몸
  let body;
  if (f.has('ghost')) {
    body = `<path d="M30 120 C30 104 34 94 46 90 L74 90 C86 94 90 104 90 120 C86 114 82 118 78 113 C74 119 70 114 66 119 C62 114 58 119 54 114 C50 119 46 114 42 119 C38 113 34 118 30 120 Z" fill="${outfit}" stroke="${shade(outfit, -0.3)}" stroke-width="1.2" opacity="0.85"/>`;
  } else if (f.has('slime')) {
    body = `<path d="M22 120 C22 100 36 90 60 89 C84 90 98 100 98 120 Z" fill="${outfit}" stroke="${shade(outfit, -0.3)}" stroke-width="1.2" opacity="0.92"/>` +
      `<path d="M32 104 C32 110 30 114 33 116 C36 114 35 110 34 104 Z M86 100 C86 108 88 112 85 114 C82 112 83 106 84 100 Z" fill="${skin}" opacity="0.8"/>`;
  } else {
    body = `<path d="M18 120 C18 100 32 91 60 90 C88 91 102 100 102 120 Z" fill="${outfit}" stroke="${shade(outfit, -0.35)}" stroke-width="1.2"/>` +
      `<path d="M48 91 L60 101 L72 91" fill="none" stroke="${shade(outfit, -0.25)}" stroke-width="1.5"/>`;
  }
  const neck = f.has('floatingHead')
    ? `<rect x="54" y="82" width="12" height="11" fill="${skin}" stroke="${skinD}" stroke-width="1"/><ellipse cx="60" cy="82" rx="7" ry="2.2" fill="#9fb3ff" opacity="0.9"/><ellipse cx="60" cy="${80 + headLift}" rx="10" ry="3" fill="#b9c6ff" opacity="0.35"/>`
    : `<rect x="54" y="80" width="12" height="13" fill="${skin}" fill-opacity="${skinAlpha}" stroke="${skinD}" stroke-width="1"/>`;

  let bodyFront = '';
  for (const k of Object.keys(FRONT_BODY)) if (f.has(k)) bodyFront += FRONT_BODY[k](lk);

  const head = `<ellipse cx="60" cy="60" rx="23.5" ry="24.5" fill="${skin}" fill-opacity="${skinAlpha}" stroke="${skinD}" stroke-width="1.2"/>`;

  let faceExtra = '';
  for (const k of Object.keys(FACE_EXTRA)) if (f.has(k)) faceExtra += FACE_EXTRA[k](lk);
  let top = '';
  for (const k of Object.keys(HEAD_TOP)) if (f.has(k)) top += HEAD_TOP[k](lk);

  const z = expr === 'sleep' ? `<text x="88" y="40" font-size="12" font-weight="700" fill="#7b8cff" font-family="sans-serif">z</text><text x="96" y="30" font-size="9" font-weight="700" fill="#7b8cff" font-family="sans-serif">z</text>` : '';
  const heart = expr === 'love' ? `<path d="M96 30 l-5 -5 a3 3 0 0 1 5 -3.2 a3 3 0 0 1 5 3.2 Z" fill="#ff5c8a"/>` : '';

  const backHair = `<g transform="translate(0 ${headLift})">${hairBack(lk.hairStyle, hairC, hairD)}</g>`;
  const headGroup = `<g transform="translate(0 ${headLift})">${head}${eyes(expr, lk.eye, lk)}${blush(expr)}${mouth(expr, lk)}${hairFront(lk.hairStyle, hairC, hairD)}${faceExtra}${top}${z}${heart}</g>`;

  const id = opts.id ? ` id="${opts.id}"` : '';
  const cls = opts.className ? ` class="${opts.className}"` : '';
  return `<svg${id}${cls} viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${sp.name} ${sp.given}">${back}${backHair}${body}${neck}${bodyFront}${headGroup}</svg>`;
}

/** 전투 상황에 맞는 표정 */
function expressionFor(unit) {
  if (unit.fainted) return 'hurt';
  if (unit.st?.sleep) return 'sleep';
  if (unit.gone === 'friend') return 'love';
  if (unit.gone === 'fled') return 'hurt';
  if (unit.side === 'enemy') {
    const br = unit.bond / unit.bondMax;
    if (br >= 0.85) return 'love';
    if (br >= 0.55) return 'shy';
    if (unit.hp / unit.maxHp < 0.3) return 'hurt';
    if (unit.boss && br < 0.2) return 'angry';
    return 'normal';
  }
  if (unit.hp / unit.maxHp < 0.3) return 'hurt';
  return 'normal';
}

return { shade, portraitSVG, expressionFor };

// localStorage 래퍼. 사파리 사생활 모드 등에서 실패해도 게임은 계속된다.
const META_KEY = 'monmusu.meta.v1';
const RUN_KEY = 'monmusu.run.v1';

function read(key) {
  try { return localStorage.getItem(key); } catch { return null; }
}
function write(key, val) {
  try { if (val == null) localStorage.removeItem(key); else localStorage.setItem(key, val); } catch { /* 무시 */ }
}

function loadMeta() {
  const def = { seen: [], friends: [], runs: 0, wins: 0, trueEnds: 0, best: 0, sound: true, speed: 1 };
  try { return { ...def, ...(JSON.parse(read(META_KEY)) || {}) }; } catch { return def; }
}
function saveMeta(meta) { write(META_KEY, JSON.stringify(meta)); }

function loadRunJson() { return read(RUN_KEY); }
function saveRunJson(json) { write(RUN_KEY, json); }
function clearRun() { write(RUN_KEY, null); }

return { loadMeta, saveMeta, loadRunJson, saveRunJson, clearRun };
})();

const __m_src_ui_audio_js = (() => {
// 아주 작은 WebAudio 효과음. 외부 파일 없음.
let ctx = null;
let enabled = true;
function setSound(on) { enabled = on; }

function ac() {
  if (!ctx) {
    const C = globalThis.AudioContext || globalThis.webkitAudioContext;
    if (!C) return null;
    ctx = new C();
  }
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}

function tone(freq, dur = 0.08, type = 'sine', vol = 0.08, when = 0, slide = 0) {
  if (!enabled) return;
  const a = ac();
  if (!a) return;
  const t = a.currentTime + when;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t);
  o.stop(t + dur + 0.02);
}

  <div class="row"><button class="btn ghost" data-act="toTitle">← 돌아가기</button></div>
</section>`;

// ── 지도 ───────────────────────────────────────────────────
SCREENS.map = () => {
  const r = S.run;
  const open = new Set(availableNodes(r).map((n) => n.id));
  const visited = new Set(r.visited || []);
  const nodes = Object.values(r.map.nodes);
  const rowH = 66;
  const H = (MAP_ROWS + 1) * rowH;
  const pos = (n) => ({ x: ((n.col + 0.5) / 4) * 100, y: (MAP_ROWS - n.row) * rowH + rowH / 2 });
  let lines = '';
  for (const n of nodes) {
    for (const id of n.next) {
      const a = pos(n); const b = pos(r.map.nodes[id]);
      const hot = n.id === r.nodeId && open.has(id);
      const done = visited.has(n.id) && (visited.has(id) || id === r.nodeId);
      lines += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${hot ? 'var(--lantern)' : done ? 'var(--moon)' : 'var(--line)'}" stroke-width="${hot ? 2.5 : 1.6}" stroke-dasharray="${hot || done ? '0' : '4 5'}" vector-effect="non-scaling-stroke"/>`;
    }
  }
  const nodeEls = nodes.map((n) => {
    const p = pos(n);
    const cls = ['node', n.type === 'boss' ? 'boss' : '', open.has(n.id) ? 'open' : '', visited.has(n.id) ? 'visited' : '', n.id === r.nodeId ? 'current' : ''].join(' ');
    const t = NODE_TYPES[n.type];
    return `<button class="${cls}" style="left:${p.x}%;top:${p.y}px" ${open.has(n.id) ? `data-act="go" data-id="${n.id}"` : 'tabindex="-1"'} title="${t.name}" aria-label="${t.name}">${t.icon}</button>`;
  }).join('');
  const legend = Object.entries(NODE_TYPES).map(([, t]) => `<span>${t.icon} ${t.name}</span>`).join('');
  return `${topbar()}
  <div class="map-wrap">
    <section class="panel map">
      <div class="eyebrow">${r.act}막</div>
      <h2>${ACT_NAMES[r.act - 1]}</h2>
      <p class="muted small" style="margin:2px 0 0">빛나는 칸을 눌러 다음 길을 고르세요. 맨 위에 이 숲의 주인이 기다립니다.</p>
      <div class="map-board" style="height:${H}px">
        <svg class="edges" viewBox="0 0 100 ${H}" preserveAspectRatio="none" aria-hidden="true">${lines}</svg>
        ${nodeEls}
      </div>
      <div class="legend">${legend}</div>
    </section>
    <aside class="party-side">
      <div class="eyebrow">동료 ${r.party.length}/${r.maxParty}</div>
      ${r.party.map((u) => `<button class="mini${u.fainted ? ' fainted' : ''}" data-act="detail" data-uid="${u.uid}">
        ${pic(u.species, u.fainted ? 'hurt' : 'normal')}
        <div class="stack" style="gap:3px;min-width:0">
          <div class="row" style="gap:6px;justify-content:space-between"><b style="font-family:var(--font-display);font-weight:400">${u.name}</b><span class="small muted">Lv.${u.level} ${ELEMENTS[u.element].icon}</span></div>
          ${u.fainted ? '<span class="small" style="color:var(--danger)">기절 — 휴식이나 깃털로 회복</span>' : hpBar(u.hp, u.maxHp)}
          <div class="bar xp" title="경험치"><i style="width:${pct(u.xp, xpToNext(u.level))}"></i></div>
        </div>
      </button>`).join('')}
      ${synergyBox(r)}
      ${banterBox(r)}
      <p class="small muted" style="margin:0">동료를 누르면 능력치·스킬을 보고 회복 아이템을 쓸 수 있어요.</p>
    </aside>
  </div>`;
};

function synergyBox(run) {
  const syn = activeSynergies(run.party);
  if (!syn.length) return '';
  return `<div class="panel synergy-box"><div class="eyebrow">💞 인연 효과</div>${syn.map((x) => `<div class="small"><b>${x.name}</b> <span class="muted">${x.desc}</span></div>`).join('')}</div>`;
}

function banterBox(run) {
  const lines = pickBanter(run);
  if (!lines || !lines.length) return '';
  return `<div class="chat" aria-label="동료들의 수다">${lines.map(({ uid, line }) => {
    const u = run.party.find((x) => x.uid === uid);
    return `<div class="chat-line"><span class="chat-pic">${portraitSVG(u.species, 'happy')}</span><div class="chat-bubble"><b>${u.name}</b> ${line}</div></div>`;
  }).join('')}</div>`;
}

function synergyHints(u) {
  const party = S.run ? S.run.party : [];
  const rel = SYNERGIES.filter((x) => x.members.includes(u.species));
  if (!rel.length) return '';
  return `<div class="small"><span class="eyebrow">인연</span> ${rel.map((x) => {
    const other = x.members.find((m) => m !== u.species);
    const on = x.members.every((m) => party.some((p) => p.species === m && !p.fainted));
    return `<span class="tag${on ? ' on' : ''}" title="${x.desc}">${on ? '💞' : '🤍'} ${x.name} · ${SPECIES[other].name}</span>`;
  }).join(' ')}</div>`;
}

function unitDetail(u) {
  const sp = SPECIES[u.species];
  const run = S.run;
  const usable = ['potion', 'feather', 'elixir'].filter((k) => run && run.items[k] > 0 && run.party.includes(u));
  return () => `
    <div class="detail-head">${pic(u.species, u.fainted ? 'hurt' : 'happy')}
      <div class="stack" style="gap:4px">
        <h2>${u.name} <span class="muted small">${sp.name} · Lv.${u.level}</span></h2>
        <div class="row" style="gap:6px">${elemTag(u.element)}<span class="tag">${sp.role}</span><span class="tag">좋아하는 것 ${ITEMS[sp.gift].icon}</span></div>
        ${hpBar(u.hp, u.maxHp)}
        <div class="small muted">경험치 ${u.xp}/${xpToNext(u.level)}</div>
      </div>
    </div>
    <div class="stats"><div>HP<b>${u.maxHp}</b></div><div>공격<b>${u.atk}</b></div><div>방어<b>${u.def}</b></div><div>매력<b>${u.cha}</b></div><div>속도<b>${u.spd}</b></div></div>
    <div class="skill-list">${sp.skills.map((s) => skillLine(s, u)).join('')}</div>
    ${synergyHints(u)}
    <p class="small muted" style="margin:0">${sp.lore}</p>
    ${usable.length ? `<div class="row">${usable.map((k) => `<button class="btn small" data-act="useOutside" data-id="${k}" data-uid="${u.uid}">${ITEMS[k].icon} ${ITEMS[k].name} 사용 (${run.items[k]})</button>`).join('')}</div>` : ''}
    <div class="row end"><button class="btn" data-act="closeModal">닫기</button></div>`;
}

// ── 전투 ───────────────────────────────────────────────────
function intentHtml(e) {
  if (!e.intent || !alive(e)) return '';
  if (e.st.sleep) return '<div class="intent">💤 잠듦</div>';
  const s = SKILLS[e.intent.skill];
  if (s.kind === 'wait') return '<div class="intent shy">💭 머뭇머뭇…</div>';
  const t = e.intent.target != null ? findUnit(S.battle, e.intent.target) : null;
  const tgt = s.target === 'allEnemies' ? ' → 전체' : t && t.side === 'ally' ? ` → ${t.name}` : '';
  return `<div class="intent ${s.kind === 'attack' ? 'atk' : ''}" title="${s.name}: ${s.desc}">${KIND_ICON[s.kind]} ${s.name}${tgt}</div>`;
}

function unitCard(u) {
  const b = S.battle;
  const ui = S.ui;
  const cls = ['unit', u.side];
  if (u.side === 'ally') {
    if (canAct(b, u) && !ui.busy) cls.push('ready');
    if (ui.selected === u.uid) cls.push('selected');
    if (b.acted.includes(u.uid) || u.st.sleep) cls.push('acted');
    if (u.fainted) cls.push('fainted');
  }
  if (u.gone) cls.push('gone', u.gone);
  const tg = targetsNow();
  let act = '';
  if (tg && tg.has(u.uid)) { cls.push('targetable'); if (u.side === 'enemy' && ui.targetMode === 'harm') cls.push('foe-t'); act = `data-act="target" data-uid="${u.uid}"`; }
  else if (u.side === 'ally' && canAct(b, u)) act = `data-act="select" data-uid="${u.uid}"`;
  else act = `data-act="inspect" data-uid="${u.uid}"`;
  const sp = SPECIES[u.species];
  const badge = u.boss ? '<span class="badge">👑</span>' : u.elite ? '<span class="badge">💢</span>' : '';
  const goneTxt = u.gone === 'friend' ? '<div class="small" style="color:var(--heart)">💗 친구가 되었다!</div>' : u.gone === 'fled' ? '<div class="small muted">도망쳤다</div>' : u.gone === 'left' ? '<div class="small muted">돌아갔다</div>' : '';
  return `<button class="${cls.join(' ')}" data-uid="${u.uid}" ${act} aria-label="${u.name} ${sp.name}">
    ${u.side === 'enemy' ? intentHtml(u) : ''}${badge}
    ${pic(u.species, expressionFor(u))}
    <div class="name"><b>${u.name}</b><span class="small muted">${sp.name} Lv.${u.level} ${ELEMENTS[u.element].icon}</span></div>
    ${hpBar(u.hp, u.maxHp, u.st.shield || 0)}
    ${u.side === 'enemy' ? bondBar(u.bond, u.bondMax) : ''}
    <div class="sts">${statusChips(u)}${u.fainted ? '<span class="st bad">기절</span>' : ''}</div>
    ${goneTxt}
  </button>`;
}

/** 지금 고를 수 있는 대상 uid 집합 (없으면 null) */
function targetsNow() {
  const ui = S.ui; const b = S.battle;
  if (!b || ui.busy) return null;
  if (ui.pendingSkill) {
    const u = findUnit(b, ui.selected);
    const s = SKILLS[ui.pendingSkill];
    ui.targetMode = s.kind === 'charm' ? 'charm' : 'harm';
    return new Set(validTargets(b, u, s).map((x) => x.uid));
  }
  if (ui.pendingTalk) { ui.targetMode = 'charm'; return new Set(livingEnemies(b).map((x) => x.uid)); }
  if (ui.pendingItem) {
    const it = ITEMS[ui.pendingItem];
    ui.targetMode = it.gift ? 'charm' : 'harm';
    if (it.target === 'enemy') return new Set(livingEnemies(b).map((x) => x.uid));
    if (it.target === 'ally') return new Set(b.allies.filter(alive).map((x) => x.uid));
    if (it.target === 'fallenAlly') return new Set(b.allies.filter((x) => x.fainted).map((x) => x.uid));
  }
  return null;
}

SCREENS.battle = () => {
  const b = S.battle; const ui = S.ui; const run = S.run;
  const sel = ui.selected != null ? findUnit(b, ui.selected) : null;
  const kindLbl = b.kind === 'boss' ? '👑 보스전' : b.kind === 'elite' ? '💢 강적' : `턴 ${b.turn}`;
  let cmd = '';
  if (b.phase === 'player') {
    let skills = '';
    if (sel && canAct(b, sel)) {
      const usable = usableSkills(b, sel);
      skills = unlockedSkills(sel).map((id, i) => {
        const s = SKILLS[id];
        const ok = usable.includes(id) && !ui.busy;
        const cd = sel.cd[id] ? `⏳${sel.cd[id]}` : s.cd ? `↻${s.cd}` : '';
        return `<button class="btn skill k-${s.kind}${ui.pendingSkill === id ? ' selected' : ''}" data-act="skill" data-id="${id}" ${ok ? '' : 'disabled'} title="${s.desc}">
          <span class="top"><span>${KIND_ICON[s.kind]} ${s.name}</span><span class="small muted">${i + 1} ${cd}</span></span>
          <span class="desc">${s.desc}${s.power ? ` (위력 ${s.power}${s.hits > 1 ? `×${s.hits}` : ''})` : ''}</span></button>`;
      }).join('');
    }
    const bag = Object.entries(run.items).map(([k, n]) => `<button class="btn small item-btn${ui.pendingItem === k ? ' selected' : ''}" data-act="item" data-id="${k}" ${b.keeperUsed || ui.busy ? 'disabled' : ''} title="${ITEMS[k].name}: ${ITEMS[k].desc}">${ITEMS[k].icon}<span class="n">${n}</span></button>`).join('');
    const hint = ui.pendingSkill ? `${SKILLS[ui.pendingSkill].name}: 대상을 고르세요` : ui.pendingTalk ? '말을 걸 몬무스를 고르세요' : ui.pendingItem ? `${ITEMS[ui.pendingItem].name}: 대상을 고르세요` : sel && canAct(b, sel) ? '' : b.allies.some((u) => canAct(b, u)) ? '행동할 동료를 고르세요' : '모두 행동했어요. 턴을 마치세요';
    cmd = `<section class="panel command">
      ${sel && canAct(b, sel) ? `<div class="who">${sel.name}의 행동</div><div class="skills">${skills}</div>` : ''}
      <div class="keeper"><span class="lbl">🏮 등불지기${b.keeperUsed ? ' (행동 완료)' : ''}</span>
        <button class="btn small heart${ui.pendingTalk ? ' selected' : ''}" data-act="talk" ${b.keeperUsed || ui.busy ? 'disabled' : ''} title="적의 호감도를 조금 올린다">💬 말 걸기</button>
        <div class="bag">${bag}</div>
      </div>
      <div class="hint">${hint}</div>
      <div class="row end">
        ${ui.pendingSkill || ui.pendingTalk || ui.pendingItem ? '<button class="btn ghost" data-act="cancel">취소</button>' : ''}
        <button class="btn" data-act="auto" ${ui.busy ? 'disabled' : ''} title="남은 행동을 자동으로 정하고 턴을 마칩니다">⚙️ 자동</button>
        <button class="btn primary" data-act="endTurn" ${ui.busy ? 'disabled' : ''}>턴 종료 ⏎</button>
      </div>
    </section>`;
  }
  return `${topbar()}
  <section class="battle">
    <div class="side enemies">${b.enemies.map(unitCard).join('')}</div>
    <div class="vs">${kindLbl}</div>
    <div class="log" aria-live="polite">${(ui.log || []).slice(-6).map((l) => `<p>${l}</p>`).join('')}</div>
    <div class="side allies">${b.allies.map(unitCard).join('')}</div>
    ${cmd}
  </section>`;
};

function afterBattleRender() {
  const log = $('.log');
  if (log) log.scrollTop = log.scrollHeight;
}

function addLog(msg) {
  S.ui.log = S.ui.log || [];
  S.ui.log.push(msg);
  if (S.ui.log.length > 40) S.ui.log.shift();
  const log = $('.log');
  if (log) {
    log.innerHTML = S.ui.log.slice(-6).map((l) => `<p>${l}</p>`).join('');
    log.scrollTop = log.scrollHeight;
  }
}

function cardEl(uid) { return $(`.unit[data-uid="${uid}"]`); }
function floatText(uid, text, cls) {
  const el = cardEl(uid);
  if (!el) return;
  const f = document.createElement('div');
  f.className = `float ${cls}`;
  f.textContent = text;
  el.appendChild(f);
  setTimeout(() => f.remove(), 1000);
}
function speech(uid, line) {
  const el = cardEl(uid);
  if (!el || !line) return;
  const s = document.createElement('div');
  s.className = 'speech';
  s.textContent = line;
  el.appendChild(s);
  setTimeout(() => s.remove(), 2600);
}
function retint(uid, disp) {
  const el = cardEl(uid);
  const u = findUnit(S.battle, uid);
  if (!el || !u) return;
  const d = disp[uid];
  const hp = el.querySelector('.bar.hp');
  if (hp) {
    hp.querySelector('i').style.width = pct(d.hp, u.maxHp);
    hp.classList.toggle('low', d.hp / u.maxHp < 0.3);
    el.querySelector('[data-hpv]').textContent = `${Math.max(0, Math.round(d.hp))}/${u.maxHp}`;
  }
  const bd = el.querySelector('.bar.bond');
  if (bd) {
    bd.querySelector('i').style.width = pct(d.bond, u.bondMax);
    el.querySelector('[data-bondv]').textContent = `${Math.round((d.bond / u.bondMax) * 100)}%`;
  }
  const p = el.querySelector('.pic');
  if (p) p.innerHTML = portraitSVG(u.species, d.expr || expressionFor({ ...u, hp: d.hp, bond: d.bond, st: {} }));
}

/** 엔진 이벤트를 순서대로 연출한다. disp = 연출 시작 시점의 표시값 */
async function play(events, disp) {
  const b = S.battle;
  for (const e of events) {
    const u = e.uid != null ? findUnit(b, e.uid) : null;
    const nm = u ? u.name : '';
    switch (e.type) {
      case 'action': {
        const s = SKILLS[e.skill];
        if (s.kind === 'wait') break;
        addLog(`<b>${nm}</b>의 ${s.name}!`);
        const el = cardEl(e.uid);
        if (el) { el.classList.remove('lunge'); void el.offsetWidth; el.classList.add('lunge'); }
        await wait(300);
        break;
      }
      case 'damage': {
        if (!disp[e.uid]) break;
        disp[e.uid].hp -= e.amount;
        const lbl = e.cause === 'poison' ? '☠️' : e.cause === 'burn' ? '🔥' : e.cause === 'thorn' ? '🌹' : '';
        floatText(e.uid, `${lbl}-${e.amount}${e.crit ? '!' : ''}`, e.crit ? 'crit' : 'dmg');
        if (e.eff === 'super') addLog('효과가 굉장했다!');
        const el = cardEl(e.uid);
        if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
        e.crit ? sfx.crit() : sfx.hit();
        retint(e.uid, disp);
        await wait(e.cause ? 220 : 260);
        break;
      }
      case 'heal':
        if (!disp[e.uid] || !e.amount) break;
        disp[e.uid].hp += e.amount;
        floatText(e.uid, `+${e.amount}`, 'heal');
        sfx.heal();
        retint(e.uid, disp);
        await wait(200);
        break;
      case 'bond':
        if (!disp[e.uid]) break;
        disp[e.uid].bond = Math.max(0, disp[e.uid].bond + e.amount);
        if (e.amount > 0) { floatText(e.uid, `💗+${Math.round((e.amount / u.bondMax) * 100)}%`, 'bond'); sfx.heart(); }
        else floatText(e.uid, `💔${Math.round((e.amount / u.bondMax) * 100)}%`, 'miss');
        retint(e.uid, disp);
        await wait(e.amount > 0 ? 260 : 120);
        break;
      case 'miss': floatText(e.uid, '회피!', 'miss'); sfx.miss(); await wait(200); break;
      case 'resist': floatText(e.uid, '버텼다!', 'miss'); await wait(160); break;
      case 'block': floatText(e.uid, `🔰${e.amount}`, 'block'); await wait(150); break;
      case 'status': {
        const st = STATUSES[e.status];
        if (st) { floatText(e.uid, `${st.icon}${st.name}`, st.bad ? 'miss' : 'heal'); if (!st.bad) sfx.buff(); }
        await wait(140);
        break;
      }
      case 'cleanse': floatText(e.uid, '✨정화', 'heal'); await wait(140); break;
      case 'wake': addLog(`${nm}${josa(nm, '이', '가')} 깨어났다.`); break;
      case 'sleeping': addLog(`${nm}${josa(nm, '은', '는')} 쿨쿨 자고 있다…`); await wait(200); break;
      case 'gold': floatText(e.uid, `🪙+${e.amount}`, 'heal'); sfx.coin(); await wait(150); break;
      case 'speech': speech(e.uid, e.line); await wait(500); break;
      case 'text':
        addLog(e.msg);
        if (e.shy && e.uid != null) { disp[e.uid].expr = 'shy'; retint(e.uid, disp); delete disp[e.uid].expr; floatText(e.uid, '///', 'bond'); }
        await wait(280);
        break;
      case 'keeper':
        if (e.action === 'talk') { addLog(`등불지기가 ${nm}에게 말을 걸었다.`); speech(e.uid, talkLine(u)); }
        else addLog(`등불지기가 ${ITEMS[e.item].icon} ${ITEMS[e.item].name}${josa(ITEMS[e.item].name, '을', '를')} 사용했다.`);
        await wait(280);
        break;
      case 'befriend': {
        sfx.befriend();
        addLog(`💗 <b>${nm}</b>${josa(nm, '이', '가')} 마음을 열었다!`);
        disp[e.uid].expr = 'love';
        retint(e.uid, disp);
        speech(e.uid, e.line);
        const el = cardEl(e.uid);
        if (el) el.classList.add('gone', 'friend');
        markSeen(u.species, true);
        await wait(1100);
        break;
      }
      case 'flee': {
        sfx.flee();
        addLog(`${nm}${josa(nm, '은', '는')} 도망쳤다.`);
        speech(e.uid, e.line);
        const el = cardEl(e.uid);
        if (el) el.classList.add('gone');
        await wait(700);
        break;
      }
      case 'leave': { const el = cardEl(e.uid); if (el) el.classList.add('gone'); break; }
      case 'faint': {
        sfx.faint();
        addLog(`${nm}${josa(nm, '이', '가')} 쓰러졌다…`);
        const el = cardEl(e.uid);
        if (el) el.classList.add('fainted');
        await wait(500);
        break;
      }
      case 'revive':
        disp[e.uid] = { hp: e.amount, bond: 0 };
        rerenderWith(disp);
        floatText(e.uid, '부활!', 'heal'); sfx.heal(); addLog(`${nm}${josa(nm, '이', '가')} 다시 일어났다!`);
        await wait(300);
        break;
      case 'summon':
        disp[e.uid] = { hp: u.maxHp, bond: 0 };
        rerenderWith(disp);
        addLog(`${nm}${josa(nm, '이', '가')} 나타났다!`); markSeen(u.species);
        await wait(400);
        break;
      case 'escape': addLog('연막 속으로 도망쳤다!'); await wait(400); break;
      case 'synergy': addLog(`💞 인연 효과 — <b>${e.name}</b>!`); await wait(350); break;
      case 'turn':
        if (e.side === 'enemy') { addLog('— 몬무스들의 차례 —'); await wait(250); }
        break;
      default: break;
    }
  }
}

/** 새 카드가 생겨 다시 그려야 할 때, 연출 중인 표시값은 그대로 유지한다 */
function rerenderWith(disp) {
  render();
  for (const uid of Object.keys(disp)) if (findUnit(S.battle, Number(uid))) retint(Number(uid), disp);
}

function talkLine(u) {
  const lines = ['…뭐야, 갑자기.', '흐응, 무슨 얘기?', '너 이상한 인간이네.', '…조금은 들어줄게.', '그, 그렇게 말해도…'];
  if (!u) return '';
  const br = u.bond / u.bondMax;
  if (br > 0.6) return SPECIES[u.species].lines.shy;
  return lines[(u.uid + S.battle.turn) % lines.length];
}

function snapshot() {
  const b = S.battle;
  const d = {};
  for (const u of [...b.allies, ...b.enemies]) d[u.uid] = { hp: u.hp, bond: u.bond };
  return d;
}

async function runAction(fn) {
  if (S.ui.busy) return;
  const disp = snapshot();
  let ev;
  try { ev = fn(); } catch (err) { toast(err.message); return; }
  S.ui.busy = true;
  S.ui.pendingSkill = S.ui.pendingItem = null; S.ui.pendingTalk = false;
  // 버튼만 비활성화한 화면에서 연출
  rerenderWith(disp);
  await play(ev, disp);
  S.ui.busy = false;
  autoSelect();
  render();
  await checkBattleOver();
}

function autoSelect() {
  const b = S.battle;
  const cur = b.allies.find((u) => u.uid === S.ui.selected);
  if (cur && canAct(b, cur)) return;
  const next = b.allies.find((u) => canAct(b, u));
  S.ui.selected = next ? next.uid : null;
}

async function checkBattleOver() {
  const b = S.battle;
  if (b.phase === 'won' || b.phase === 'lost' || b.phase === 'fled') {
    await wait(600);
    if (b.phase === 'won') sfx.win();
    if (b.phase === 'lost') sfx.lose();
    concludeBattle();
  }
}

function startBattle(battle) {
  S.battle = battle;
  S.ui = { selected: null, log: [], busy: false };
  for (const e of battle.enemies) markSeen(e.species);
  const names = battle.enemies.map((e) => e.name).join(', ');
  addLog(battle.kind === 'boss' ? `👑 ${names}${josa(names, '이', '가')} 앞을 가로막는다!` : `야생의 ${names}${josa(names, '이', '가')} 나타났다!`);
  autoSelect();
  S.screen = 'battle';
  render();
  const first = battle.enemies[0];
  setTimeout(() => speech(first.uid, SPECIES[first.species].lines.intro), 250);
  if (battle.events.length) { const disp = snapshot(); play(battle.events.filter((e) => e.type !== 'turn'), disp); battle.events = []; }
  if (!S.meta.tutorial) {
    S.meta.tutorial = true;
    saveMeta(S.meta);
    openModal(() => `<div class="eyebrow">첫 전투</div><h2>싸울까, 친구가 될까?</h2>
      <ul class="tut">
        <li>테두리가 빛나는 동료를 누르고 <b>스킬</b> → <b>대상</b>을 고르세요.</li>
        <li>몬무스의 <span style="color:var(--leafhp)">❤ HP</span>가 0이 되면 도망치고, <span style="color:var(--heart)">💗 호감도</span>가 가득 차면 <b>친구</b>가 되어 동료로 합류해요.</li>
        <li>💗 매혹 스킬, 등불지기의 <b>💬 말 걸기</b>, 좋아하는 <b>선물</b>로 호감도를 올려요. 때리면 호감도가 조금 떨어져요.</li>
        <li>적 머리 위 말풍선은 <b>다음 행동</b>이에요. 다 고르면 <b>턴 종료</b>!</li>
      </ul>
      <div class="row end"><button class="btn primary" data-act="closeModal">알겠어요</button></div>`);
  }
}

function concludeBattle() {
  const b = S.battle;
  const run = S.run;
  const res = finishBattle(run, b);
  if (b.phase === 'lost') return gameOver();
  if (b.phase === 'fled') { toast('무사히 도망쳤다!'); return toMap(); }
  for (const r of res.recruits) markSeen(r.species, true);
  S.pending = {
    result: res,
    kind: b.kind,
    bossNode: b.kind === 'boss' && run.nodeId === 'boss',
    bossFriend: b.befriended.some((e) => e.boss),
    befriended: b.befriended.map((e) => e.name),
    relicPicked: !res.relicChoices.length,
    // 최종 보스는 엔딩에서 함께하므로 영입 창을 띄우지 않는다
    recruits: res.recruits.filter((r) => !(b.kind === 'boss' && run.act === 3 && SPECIES[r.species].boss)),
  };
  S.battle = null;
  S.screen = 'reward';
  render();
}

function newSkillNote(l) {
  const u = S.run.party.find((x) => x.uid === l.uid);
  if (!u) return '';
  const sp = SPECIES[u.species];
  const learned = sp.skills.filter((_, i) => SKILL_UNLOCK[i] > l.from && SKILL_UNLOCK[i] <= l.to);
  return learned.length ? ` <span style="color:var(--lantern)">· 새 스킬 ${learned.map((s) => SKILLS[s].name).join(', ')}!</span>` : '';
}

function rewardNext() {
  const p = S.pending;
  if (p.recruits.length) return showRecruit(p.recruits.shift(), rewardNext);
  S.pending = null;
  if (p.bossNode) {
    const r = advanceAct(S.run, p.bossFriend);
    if (r.ending) return ending(r.ending);
    S.screen = 'actclear';
    S.ui = { bossFriend: p.bossFriend };
    return render();
  }
  toMap();
}

    return `<div class="panel entry ${cls}">${pic(id, fr ? 'happy' : 'normal', fr)}
      <b>${fr || seen ? `${sp.given} · ${sp.name}` : '???'}</b>
      ${fr ? `<span class="small">${ELEMENTS[sp.element].icon} ${sp.role} · 💗 ${ITEMS[sp.gift].icon}</span><span class="small muted">${sp.lore}</span>` : seen ? '<span class="small muted">만난 적 있다. 아직 친구가 아니다.</span>' : '<span class="small muted">아직 만나지 못했다.</span>'}
    </div>`;
  }).join('')}</div>
  </section>`;
};

SCREENS.help = () => `<section class="panel stack help">
  <div class="row" style="justify-content:space-between"><h1 style="font-size:28px">도움말</h1><button class="btn" data-act="toTitle">← 타이틀</button></div>
  <h3>목표</h3>
  <p>3막으로 된 숲을 지나 달의 마녀 녹스에게 닿으세요. 지도에서 갈림길을 고르며 전투, 이벤트, 상점, 모닥불을 거칩니다.</p>
  <h3>싸울까, 친구가 될까</h3>
  <ul>
    <li>몬무스는 <b>HP ❤</b>와 <b>호감도 💗</b>를 가지고 있어요. HP가 0이 되면 도망치고, 호감도가 가득 차면 <b>친구</b>가 되어 동료로 합류할 수 있어요.</li>
    <li>💗 매혹 스킬, 등불지기의 <b>말 걸기</b>, <b>선물</b>로 호감도를 올립니다. 좋아하는 선물은 효과가 3배예요.</li>
    <li>상처 입은 몬무스일수록 마음을 잘 열지만, 공격받으면 호감도가 조금 떨어져요.</li>
    <li>보스는 HP가 절반 이하일 때까지 <b>마음의 벽</b>이 있어요. 먼저 싸운 뒤 마음을 두드리세요.</li>
  </ul>
  <h3>전투 조작</h3>
  <ul>
    <li>테두리가 빛나는 동료를 누르고 스킬을 고른 뒤, 대상을 누르세요. 숫자키 1–5로 스킬, Enter로 턴 종료, Esc로 취소.</li>
    <li>등불지기(당신)는 매 턴 한 번 <b>말 걸기</b>나 <b>아이템</b>을 쓸 수 있어요.</li>
    <li>적 머리 위의 말풍선은 다음 행동 예고예요. 공격 대상을 보고 막거나 회복하세요.</li>
    <li>속성 상성: 🔥불 → 🍃숲 → 💧물 → 🔥불 (1.5배), ✨빛 ↔ 🌙어둠은 서로 1.5배.</li>
  </ul>
  <h3>그 밖에</h3>
  <ul>
    <li>쓰러진 동료는 전투가 끝나도 기절한 채예요. 모닥불이나 불사조 깃털로 일으키세요.</li>
    <li>파티는 3명까지. 꽉 찼을 때 새 친구가 생기면 교체하거나 답례만 받을 수 있어요.</li>
    <li>지도 화면에서 자동 저장됩니다.</li>
  </ul>
</section>`;

// ── 흐름 ───────────────────────────────────────────────────
function saveRun() { if (S.run && !S.run.over) saveRunJson(serializeRun(S.run)); }

function toMap() {
  S.screen = 'map';
  S.battle = null;
  S.ui = {};
  saveRun();
  render();
  window.scrollTo({ top: 0 });
}

function startRun(seed) {
  S.ui = { seed };
  S.screen = 'starter';
  render();
}

function go(nodeId) {
  const run = S.run;
  run.visited = run.visited || [];
  let res;
  try { res = enterNode(run, nodeId); } catch (e) { toast(e.message); return; }
  run.visited.push(nodeId);
  sfx.click();
  switch (res.type) {
    case 'battle':
      if (res.battle.kind === 'boss') return bossIntro(res.battle);
      return startBattle(res.battle);
    case 'shop': S.ui = { shop: res.shop }; S.screen = 'shop'; break;
    case 'rest': S.ui = {}; S.screen = 'rest'; break;
    case 'treasure': S.ui = { loot: res.loot }; S.screen = 'treasure'; sfx.coin(); break;
    case 'event': { const ev = pickEvent(run); S.ui = { eventId: ev.id }; S.screen = 'event'; break; }
  }
  render();
  window.scrollTo({ top: 0 });
}

const ACTIONS = {
  continue() {
    try { S.run = deserializeRun(loadRunJson()); } catch { toast('저장 데이터를 읽을 수 없어요'); clearRun(); return render(); }
    toMap();
  },
  newGame() { startRun(Math.floor(Math.random() * 1e9)); },
  daily() {
    const d = new Date();
    const key = `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
    startRun(hashString(`moonlit-${key}`) % 1e9);
  },
  pickStarter(el) {
    S.run = newRun(S.ui.seed, el.dataset.id);
    markSeen(el.dataset.id, true);
    sfx.befriend();
    toMap();
  },
  toTitle() { S.screen = 'title'; S.ui = {}; closeModal(); render(); },
  toMap() { toMap(); },
  codex() { S.screen = 'codex'; render(); },
  help() { S.screen = 'help'; render(); },
  toggleSound() { S.meta.sound = !S.meta.sound; setSound(S.meta.sound); saveMeta(S.meta); render(); },
  menu() {
    openModal(() => `<h2>메뉴</h2>
      <div class="stack">
        <div class="small muted">시드 <span class="num">${S.run.seed}</span></div>
        <button class="btn" data-act="toggleSound">${S.meta.sound ? '🔊 소리 끄기' : '🔇 소리 켜기'}</button>
        <button class="btn" data-act="speed">연출 속도: ${S.meta.speed >= 2 ? '빠르게' : '보통'}</button>
        <button class="btn" data-act="helpModal">❔ 도움말</button>
        <button class="btn" data-act="toTitleSave">타이틀로 (${S.screen === 'map' ? '저장됨' : '마지막 지도 시점에서 이어하기'})</button>
        <button class="btn ghost" data-act="abandon">모험 포기하기</button>
      </div>
      <div class="row end"><button class="btn primary" data-act="closeModal">닫기</button></div>`);
  },
  speed() { S.meta.speed = S.meta.speed >= 2 ? 1 : 2; saveMeta(S.meta); ACTIONS.menu(); },
  helpModal() { openModal(() => SCREENS.help().replace('data-act="toTitle"', 'data-act="closeModal"').replace('← 타이틀', '닫기')); },
  toTitleSave() { closeModal(); S.screen = 'title'; render(); },
  abandon() {
    openModal(() => `<h2>정말 포기할까요?</h2><p>이번 모험의 진행이 사라집니다. 도감 기록은 남아요.</p>
      <div class="row end"><button class="btn" data-act="menu">아니요</button><button class="btn primary" data-act="abandonYes">포기하기</button></div>`);
  },
  abandonYes() { clearRun(); S.meta.runs++; saveMeta(S.meta); closeModal(); S.screen = 'title'; render(); },
  closeModal() { closeModal(); },
  faceBoss() { sfx.click(); startBattle(S.ui.battle); },
  relicInfo(el) { const r = RELICS[el.dataset.id]; toast(`${r.icon} ${r.name} — ${r.desc}`); },
  go(el) { go(el.dataset.id); },
  detail(el) { const u = S.run.party.find((x) => x.uid === Number(el.dataset.uid)); if (u) openModal(unitDetail(u)); },
  useOutside(el) {
    const uid = Number(el.dataset.uid);
    try { useItemOutside(S.run, el.dataset.id, uid); sfx.heal(); } catch (e) { return toast(e.message); }
    saveRun();
    const u = S.run.party.find((x) => x.uid === uid);
    render();
    openModal(unitDetail(u));
  },

  // 전투
  select(el) { if (S.ui.busy) return; S.ui.selected = Number(el.dataset.uid); S.ui.pendingSkill = null; S.ui.pendingItem = null; S.ui.pendingTalk = false; sfx.click(); render(); },
  inspect(el) {
    const u = findUnit(S.battle, Number(el.dataset.uid));
    if (!u) return;
    if (u.side === 'ally') return openModal(unitDetail(u));
    const sp = SPECIES[u.species];
    openModal(() => `<div class="detail-head">${pic(u.species, expressionFor(u))}<div class="stack" style="gap:4px">
      <h2>${u.name} <span class="muted small">${sp.name} · Lv.${u.level}${u.elite ? ' · 강적' : ''}</span></h2>
      <div class="row" style="gap:6px">${elemTag(u.element)}<span class="tag">${sp.role}</span><span class="tag">좋아하는 것 ${ITEMS[sp.gift].icon} ${ITEMS[sp.gift].name}</span></div>
      ${hpBar(u.hp, u.maxHp)}${bondBar(u.bond, u.bondMax)}
      <div class="small muted">마음 여는 정도 ×${receptivity(u).toFixed(2)}${u.boss && u.hp > u.maxHp / 2 ? ' (마음의 벽!)' : ''}</div></div></div>
      <div class="skill-list">${unlockedSkills(u).map((s) => skillLine(s)).join('')}</div>
      <p class="small muted" style="margin:0">${sp.lore}</p>
      <div class="row end"><button class="btn" data-act="closeModal">닫기</button></div>`);
  },
  skill(el) {
    const ui = S.ui; const b = S.battle;
    const u = findUnit(b, ui.selected);
    const s = SKILLS[el.dataset.id];
    if (!u || !canAct(b, u)) return;
    ui.pendingItem = null; ui.pendingTalk = false;
    if (needsTarget(s)) {
      const ts = validTargets(b, u, s);
      if (ts.length === 1 && s.target !== 'ally') return runAction(() => allyAct(b, S.run, S.run.rng, u.uid, s.id, ts[0].uid));
      ui.pendingSkill = ui.pendingSkill === s.id ? null : s.id;
      sfx.click();
      return render();
    }
    runAction(() => allyAct(b, S.run, S.run.rng, u.uid, s.id, null));
  },
  target(el) {
    const ui = S.ui; const b = S.battle; const uid = Number(el.dataset.uid);
    if (ui.pendingSkill) { const sk = ui.pendingSkill; return runAction(() => allyAct(b, S.run, S.run.rng, ui.selected, sk, uid)); }
    if (ui.pendingTalk) return runAction(() => keeperTalk(b, S.run, S.run.rng, uid));
    if (ui.pendingItem) { const it = ui.pendingItem; return runAction(() => useItem(b, S.run, S.run.rng, it, uid)); }
  },
  talk() { const ui = S.ui; ui.pendingSkill = null; ui.pendingItem = null; ui.pendingTalk = !ui.pendingTalk; sfx.click(); render(); },
  item(el) {
    const ui = S.ui; const id = el.dataset.id; const it = ITEMS[id];
    ui.pendingSkill = null; ui.pendingTalk = false;
    if (it.target === 'allEnemies' || it.target === 'allAllies' || it.target === 'none') {
      ui.pendingItem = null;
      return runAction(() => useItem(S.battle, S.run, S.run.rng, id, null));
    }
    ui.pendingItem = ui.pendingItem === id ? null : id;
    render();
  },
  cancel() { const ui = S.ui; ui.pendingSkill = ui.pendingItem = null; ui.pendingTalk = false; render(); },
  endTurn() {
    if (S.ui.busy || S.battle.phase !== 'player') return;
    runAction(() => endPlayerTurn(S.battle, S.run, S.run.rng));
  },
  auto() {
    if (S.ui.busy || S.battle.phase !== 'player') return;
    const b = S.battle; const run = S.run;
    const want = run.party.length < run.maxParty || b.kind === 'boss';
    runAction(() => {
      const ev = autoTurn(b, run, run.rng, { friendTarget: befriendTarget(b, run, want) });
      if (b.phase === 'player') ev.push(...endPlayerTurn(b, run, run.rng));
      return ev;
    });
  },

  // 보상
  pickRelic(el) { gainRelic(S.run, el.dataset.id); S.pending.relicPicked = true; sfx.coin(); render(); },
  skipRelic() { S.pending.relicPicked = true; render(); },
  rewardNext() { rewardNext(); },
  acceptRecruit() {
    const r = S.ui.recruit;
    joinParty(S.run, r);
    sfx.befriend();
    toast(`${이가(r.name)} 동료가 되었다!`);
    finishRecruit();
  },
  swapRecruit(el) {
    const r = S.ui.recruit;
    const old = S.run.party.find((u) => u.uid === Number(el.dataset.uid));
    joinParty(S.run, r, old.uid);
    sfx.befriend();
    toast(`${은는(old.name)} 손을 흔들며 숲으로 돌아갔다. ${이가(r.name)} 합류했다!`);
    finishRecruit();
  },
  declineRecruit() {
    const r = S.ui.recruit;
    const g = declineRecruit(S.run, r);
    toast(`${이가(r.name)} 답례로 ${ITEMS[g.gift].icon}${ITEMS[g.gift].name}과 ${g.gold}G를 주었다.`);
    finishRecruit();
  },

  // 이벤트
  choose(el) {
    const ev = eventById(S.ui.eventId);
    const c = ev.choices[Number(el.dataset.i)];
    if (c.req && !c.req(S.run)) return;
    const out = c.run(S.run);
    S.ui.outcome = out;
    sfx.click();
    render();
  },
  eventDone() {
    const out = S.ui.outcome;
    const cont = () => {
      if (out.battle) return startBattle(beginBattle(S.run, out.battle.kind, out.battle.enemies));
      toMap();
    };
    if (out.recruit) { markSeen(out.recruit.species, true); return showRecruit(out.recruit, cont); }
    cont();
  },

  // 상점/휴식/보물
  buy(el) {
    try { const g = buy(S.run, S.ui.shop, Number(el.dataset.i)); sfx.coin(); if (g.kind === 'service') toast('개운하다! 모두 완전히 회복했다.'); } catch (e) { toast(e.message); }
    render();
  },
  restHeal() { restHeal(S.run); sfx.heal(); toast('푹 쉬었다. 기운이 돌아온다.'); toMap(); },
  restTrain(el) { const lv = restTrain(S.run, Number(el.dataset.uid)); sfx.buff(); toast(`훈련 완료! Lv.${lv}`); toMap(); },
  treasureRelic(el) { gainRelic(S.run, el.dataset.id); S.ui.picked = true; sfx.coin(); render(); },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) fn(el);
});

document.addEventListener('click', (e) => {
  if (e.target.classList?.contains('modal-back') && S.modal && !S.ui.recruit) closeModal();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (S.modal && !S.ui.recruit) return closeModal();
    if (S.screen === 'battle') ACTIONS.cancel();
    return;
  }
  if (S.screen !== 'battle' || S.modal || S.ui.busy) return;
  if (e.key === 'Enter') { e.preventDefault(); ACTIONS.endTurn(); return; }
  const n = Number(e.key);
  if (n >= 1 && n <= 5) {
    const btn = document.querySelectorAll('.skill')[n - 1];
    if (btn && !btn.disabled) ACTIONS.skill(btn);
  }
});

render();

return {  };
})();
})();
</script>
